[project]
name = "taxos"
version = "0.1.0"
description = "TaxOS — Enterprise Tax Calculation Platform"
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "TaxOS Team"}]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "structlog>=24.4.0",
    "python-json-logger>=3.2.0",
    "tenacity>=9.0.0",
    "httpx>=0.28.0",
    "PyYAML>=6.0.2",
    "cachetools>=5.3.0",
    "fpdf2>=2.8.7",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pdfplumber>=0.11.0",
    "apscheduler>=3.10.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.9.0",
    "qrcode[pil]>=7.4.0",
    "PyJWT>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
    "pytest-benchmark>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxos"]

# ── Ruff ─────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4",
    "DTZ", "T20", "ICN", "PIE", "PT", "RSE", "RET", "SLF",
    "SIM", "TID", "TCH", "ARG", "ERA", "PL", "TRY", "FLY", "RUF",
]
ignore = [
    "S101",     # assert usage (needed in tests)
    "TRY003",   # long exception messages
    "PLR0913",  # too many arguments
    "TC001",    # type-checking block (application imports)
    "TC002",    # type-checking block (third-party imports)
    "TC003",    # type-checking block (stdlib imports)
    "UP046",    # type params syntax (not widely adopted yet)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLC0415", "ARG001"]
"src/taxos/infrastructure/database/migrations/**" = ["E501", "W291"]
"src/taxos/main.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["taxos"]

# ── Black ────────────────────────────────────────────────────────
[tool.black]
line-length = 99
target-version = ["py313"]

# ── MyPy ─────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "openpyxl.*",
    "yaml.*",
    "apscheduler.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ── Pytest ───────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]
