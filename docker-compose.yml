services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxos-api
    ports:
      - "8000:8000"
    env_file:
      - ${TAXOS_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://taxos:${POSTGRES_PASSWORD}@db:5432/taxos
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taxos-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: taxos-db
    environment:
      POSTGRES_USER: taxos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: taxos
    volumes:
      - taxos-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxos-network
    restart: unless-stopped

volumes:
  taxos-db-data:

networks:
  taxos-network:
    driver: bridge
