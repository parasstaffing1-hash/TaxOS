name: Verification Engine

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv pip install -e .[dev]

    - name: Run Verification Pytest Suite (Quality Score)
      run: |
        pytest tests/integration/test_verification.py -v --cov=src/taxos --cov-report=xml --cov-fail-under=95

    - name: Performance Benchmarks
      run: |
        # In a real environment, run pytest-benchmark here
        pytest tests/performance/ -v
