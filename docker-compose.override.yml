services:
  api:
    build:
      target: builder
    volumes:
      - ./src:/app/src:ro
    command: ["uv", "run", "uvicorn", "taxos.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=console
  db:
    ports:
      - "127.0.0.1:5432:5432"
